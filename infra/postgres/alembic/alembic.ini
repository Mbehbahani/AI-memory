; Alembic configuration for the AI Memory PostgreSQL schema (ADR-0001).
; Owner: A04. Invoked by `aimemory-ingest migrate` (packages/aimemory/cli/migrate.py) and directly
; via `alembic -c infra/postgres/alembic/alembic.ini upgrade head` for local verification.
;
; `%(here)s` is this file's own directory, so this ini works regardless of the process cwd -
; env.py and versions/ live next to it (a flat, non-nested alembic layout).

[alembic]
script_location = %(here)s
path_separator = os
prepend_sys_path = %(here)s/../../../packages
version_path_separator = os

; sqlalchemy.url is intentionally left unset here: env.py overrides it at runtime from
; aimemory.common.config.get_settings().postgres.dsn, so the real DSN (with its password) never
; needs to be written to a file on disk.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
