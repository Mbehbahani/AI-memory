# Dev override (auto-loaded by `docker compose`). Adds loopback-only exposure of the databases and
# Ollama for inspection (Neo4j Browser, psql, ollama CLI) and a `tools` profile with a test runner.
# Everything here binds to 127.0.0.1 only. Do not use this file for any non-local deployment.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  neo4j:
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

  ollama:
    ports:
      - "127.0.0.1:11434:11434"

  embedding-service:
    ports:
      - "127.0.0.1:8010:8010"

  tools:
    build:
      context: .
      dockerfile: infra/docker/tools.Dockerfile
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URI: ${NEO4J_URI}
      GRAPH_ALLOW_ONTOLOGY_VIOLATIONS: ${GRAPH_ALLOW_ONTOLOGY_VIOLATIONS:-false}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_URL: ${OLLAMA_URL}
      EMBED_URL: ${EMBED_URL}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      # Bedrock provider (ADR-0012/ADR-0014) — same wiring as the `ingestion` service in
      # docker-compose.yml, so `docker compose --profile tools run --rm tools ...` can exercise the
      # bedrock path (or an ad-hoc credential check) the same way the real worker would.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-4096}
      AWS_PROFILE: ${AWS_PROFILE:-mohabehb}
      AWS_REGION: ${BEDROCK_REGION:-us-east-1}
    volumes:
      - .:/workspace
      # Same relay directory the ingestion service mounts, so a `tools` run can drive an extraction
      # pass with LLM_PROVIDER=relay and read the prompts back out.
      - ./.relay:/relay
      # The project's own design docs as a source root (config/source-roots.yaml: ai-memory).
      - ${HOST_AIMEMORY_ROOT:-./infra/docker/empty-root}:/sources/ai-memory:ro
      - ${HOST_WAGTAIL_ROOT:-./infra/docker/empty-root}:/sources/wagtail:ro
      - ${HOST_SENIOR_AI_ENG_ROOT:-./infra/docker/empty-root}:/sources/senior-ai-eng:ro
      - ${HOST_APPLY_FILES_ROOT:-./infra/docker/empty-root}:/sources/apply-files:ro
      - ${HOST_APPLY_FILES_INTERVIEW_ROOT:-./infra/docker/empty-root}:/sources/apply-files-interview:ro
      - ${HOST_CONTENT_CENTER_ROOT:-./infra/docker/empty-root}:/sources/content-center:ro
      - ${HOST_VAULT_ROOT:?set HOST_VAULT_ROOT in .env}:/sources/vault:ro
      # Optional, read-only — see docker-compose.yml `ingestion` service comment and
      # docs/operations/bedrock-extraction.md. tools.Dockerfile also creates uid 1000 => /home/app.
      - ${HOST_AWS_DIR:-./infra/docker/aws-empty}:/home/app/.aws:ro
    working_dir: /workspace
    networks: [ai-memory-net]
    command: ["pytest", "-q"]
