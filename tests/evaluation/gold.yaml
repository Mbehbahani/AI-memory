    author: agent
    expected_sources_any: ["vault://my-vault/02 Areas/JobLab Product/JobLab Overview.md"]
    expected_entities: ["Databricks Delta", "Snowflake", "Tableau"]
    expected_timeline_order: ["Databricks Delta", "Snowflake", "Tableau"]
    # Real supersession chain in `facts` (subject "JobLab DE Lakehouse", predicate USES_ARCHITECTURE):
    # Databricks Delta -> Snowflake -> Tableau (current). Flagged as a likely-fail in the P14-T03
    # report: all three facts share one `valid_from` (extraction time, not a stated date), so temporal
    # ordering cannot be recovered from `valid_from` alone - a real, measured limitation, not invented.

