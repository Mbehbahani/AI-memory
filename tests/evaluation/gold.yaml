# Retrieval evaluation gold set — V0.1
# AUTHORSHIP: seeded by the orchestrator from the owner's questions; A12 extends it in P14-T03 from
# my-vault content and marks every added item `author: agent`. The owner may correct any item.
#
# P14-T03 note (A12, 2026-09-17): Q01-Q07 below are the owner's original seed questions and are left
# byte-for-byte unchanged, including Q04 (points at a JobLab DE `localfs://` architecture-decision
# document) and Q06 (uses the `mini-vault` fixture) even though the corpus now ingested is vault-only
# (177 vault:// sources; the JobLab DE repo has not been ingested into this corpus, and `run_eval.py`
# does not yet stand up an ephemeral fixture corpus for `fixture:`-marked rows - see its own docstring
# and the P14-T03 report). Both are therefore EXPECTED to score honestly poorly / be skipped rather
# than silently "fixed" to pass - that is the point of an honest gold set, not a bug in this file.
#
# Q08 onward (author: agent) were written by A12 by inspecting the real, live corpus (177 sources,
# 614 entities, 1244 facts, 729 artifacts as of 2026-09-17) directly in Postgres - project registry,
# `knowledge_artifacts`, `facts` (including real `supersedes_fact_id` chains), and chunk text - then
# writing a question that does NOT reuse the chunk's exact wording, with the expected answer recorded
# as an object id (`vault://...` source_uri) or entity/type name so scoring is objective. Three
# (Q23-Q25) are deliberately unanswerable - nothing in the corpus supports them - to measure whether
# the system stays honest under a question it cannot answer (`expect_absent: true`; see scorer.py).
version: 0.2.0
questions:
  - id: Q01
    question: "What is JobPilot?"
    author: owner
    expected_sources_any: ["vault://my-vault/AIOS/me.md", "vault://my-vault/AIOS/Maps/project-graph.md"]
    expected_entities: ["JobPilot", "SvelteKit", "Convex"]
