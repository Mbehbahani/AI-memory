# AI Memory V0.1 — base Compose topology (production-shaped: minimal host exposure).
# Dev conveniences (loopback exposure of DBs/Ollama, tools/viz profiles) live in docker-compose.override.yml.
# STATUS: Dockerfiles, service entrypoints and pinned image tags are implemented. Image digests are
# recorded in reports/image-pins.md. The latest completeness and deployment evidence is in
# reports/final-build-report.md and reports/deploy-verification.md.

name: ai-memory

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-env: &common-env
  DEVICE_ID: ${DEVICE_ID:-local-development-machine}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

networks:
  ai-memory-net:
    driver: bridge

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  ollama_models:
  ingestion_state:

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [ai-memory-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging: *default-logging

  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-5.26-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512M}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256M}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - ./infra/neo4j/schema:/schema:ro
    networks: [ai-memory-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    stop_grace_period: 30s
    logging: *default-logging

  # Opt-in since 2026-09-18. ADR-0014 makes Claude Haiku 4.5 on Bedrock the default extraction
  # provider, so the local model is the *fallback* path, not part of the default stack. Running it
  # unconditionally cost 2.4 GiB of RAM on a 15.5 GiB machine (MEASURED) to serve no request.
  # Nothing is removed: the service, its pinned image, the `ollama_models` volume and the qwen3:4b
  # pull all still exist, and the local, no-cloud path remains available with
  #     docker compose --profile local-llm up -d      (plus LLM_PROVIDER=ollama in .env)
  # That combination is also the documented way to eliminate cloud egress entirely - see
  # docs/security/threat-model.md - so this profile must never be deleted, only left unstarted.
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.34.0}
    profiles: ["local-llm"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: ${LLM_NUM_CTX:-8192}
    volumes:
      - ollama_models:/root/.ollama
    networks: [ai-memory-net]
    deploy:
      resources:
        limits:
          cpus: ${OLLAMA_CPUS:-3.0}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    logging: *default-logging

  ollama-init:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.34.0}
    profiles: ["local-llm"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
    volumes:
      - ollama_models:/root/.ollama
      - ./infra/ollama:/init:ro
    entrypoint: ["/bin/sh", "/init/pull-model.sh"]
    networks: [ai-memory-net]
    logging: *default-logging

  embedding-service:
    build:
      context: .
      dockerfile: apps/embedding-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      EMBED_MODEL_ID: ${EMBED_MODEL_ID}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}
      EMBED_MAX_SEQ: ${EMBED_MAX_SEQ:-256}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-2}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    networks: [ai-memory-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      <<: *common-env
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URI: ${NEO4J_URI}
      GRAPH_ALLOW_ONTOLOGY_VIOLATIONS: ${GRAPH_ALLOW_ONTOLOGY_VIOLATIONS:-false}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_READONLY_USER: ${NEO4J_READONLY_USER}
      NEO4J_READONLY_PASSWORD: ${NEO4J_READONLY_PASSWORD}
    command: ["aimemory-ingest", "migrate"]
    networks: [ai-memory-net]
    logging: *default-logging

  ingestion:
    # Always-on worker (ADR-0011): polls run_requests and executes scans serially. Idle ~0.2 GB (ESTIMATED).
    # One-off CLI use: docker compose exec ingestion aimemory-ingest run --root vault
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
    restart: unless-stopped
    command: ["aimemory-ingest", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      embedding-service:
        condition: service_healthy
      # No dependency on `ollama`: it is opt-in behind the `local-llm` profile (ADR-0014 makes
      # Bedrock the default extraction provider, so the local model is a fallback, not a
      # prerequisite). A hard `service_healthy` here meant a stack that never intends to run a local
      # model still could not start. When LLM_PROVIDER=ollama the provider surfaces an unreachable
      # endpoint as a normal, legible extraction error instead.
    environment:
      <<: *common-env
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URI: ${NEO4J_URI}
      GRAPH_ALLOW_ONTOLOGY_VIOLATIONS: ${GRAPH_ALLOW_ONTOLOGY_VIOLATIONS:-false}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_URL: ${OLLAMA_URL}
      LLM_PROVIDER: ${LLM_PROVIDER:-bedrock}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      # Bedrock provider (ADR-0012/ADR-0014). Only consulted when LLM_PROVIDER=bedrock; harmless
      # otherwise since boto3 is imported lazily. Credentials come from the read-only ~/.aws mount
      # below, never from an env var here. See docs/operations/bedrock-extraction.md.
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS:-4096}
      AWS_PROFILE: ${AWS_PROFILE:-mohabehb}
      AWS_REGION: ${BEDROCK_REGION:-us-east-1}
      EMBED_URL: ${EMBED_URL}
      INGEST_LLM_CONCURRENCY: ${INGEST_LLM_CONCURRENCY:-1}
      INGEST_EMBED_CONCURRENCY: ${INGEST_EMBED_CONCURRENCY:-2}
      INGEST_MAX_TEXT_BYTES: ${INGEST_MAX_TEXT_BYTES:-2097152}
      MEMORY_SOURCE_ROOTS_FILE: /app/config/source-roots.yaml
    volumes:
      # Read-only source roots. Container paths are stable; host paths come from .env.
      - ${HOST_VAULT_ROOT:?set HOST_VAULT_ROOT in .env}:/sources/vault:ro
      - ${HOST_PILOT_ROOT:?set HOST_PILOT_ROOT in .env}:/sources/joblab-de:ro
      - ${HOST_JOBLAB_DATA_PIPELINE_ROOT:-./infra/docker/empty-root}:/sources/joblab-data-pipeline:ro
      - ${HOST_JOBLAB_AGENT_API_ROOT:-./infra/docker/empty-root}:/sources/joblab-agent-api:ro
      - ${HOST_JOBLAB_ANALYTICS_FRONTEND_ROOT:-./infra/docker/empty-root}:/sources/joblab-analytics-frontend:ro
      # Optional roots use a default rather than `:?` so an unset variable cannot stop the stack
      # from starting. An unmounted root is reported by `scripts/doctor` and skipped by the scan.
      - ${HOST_WAGTAIL_ROOT:-./infra/docker/empty-root}:/sources/wagtail:ro
      - ${HOST_AIMEMORY_ROOT:-./infra/docker/empty-root}:/sources/ai-memory:ro
      - ${HOST_SENIOR_AI_ENG_ROOT:-./infra/docker/empty-root}:/sources/senior-ai-eng:ro
      - ${HOST_APPLY_FILES_ROOT:-./infra/docker/empty-root}:/sources/apply-files:ro
      - ${HOST_APPLY_FILES_INTERVIEW_ROOT:-./infra/docker/empty-root}:/sources/apply-files-interview:ro
      - ${HOST_CONTENT_CENTER_ROOT:-./infra/docker/empty-root}:/sources/content-center:ro
      - ./config:/app/config:ro
      - ./.memoryignore:/app/.memoryignore:ro
      # LLM_PROVIDER=relay writes prompts here and reads answers back. A bind mount, not a named
      # volume, because the operator answers them from the host - one `docker compose exec` per file
      # would be unusable at a few hundred prompts. Read-write by design; holds no secrets.
      - ./.relay:/relay
      - ingestion_state:/state
      # Read-only AWS credentials for the Bedrock provider, mounted at the `app` user's HOME/.aws
      # (apps/ingestion/Dockerfile creates uid 1000 with --create-home => /home/app). OPTIONAL:
      # HOST_AWS_DIR defaults to infra/docker/aws-empty (checked into git, always empty) so
      # `docker compose up -d` and LLM_PROVIDER=ollama work with zero AWS setup. Set HOST_AWS_DIR to
      # your real ~/.aws in .env only when you want LLM_PROVIDER=bedrock to work. Never copies,
      # bakes, or logs credentials — see docs/security/README.md (A13 P15 review flag) and
      # docs/operations/bedrock-extraction.md.
      - ${HOST_AWS_DIR:-./infra/docker/aws-empty}:/home/app/.aws:ro
    networks: [ai-memory-net]
    logging: *default-logging

  memory-api:
    build:
      context: .
      dockerfile: apps/memory-api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      embedding-service:
        condition: service_healthy
    environment:
      <<: *common-env
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URI: ${NEO4J_URI}
      GRAPH_ALLOW_ONTOLOGY_VIOLATIONS: ${GRAPH_ALLOW_ONTOLOGY_VIOLATIONS:-false}
      NEO4J_USER: ${NEO4J_READONLY_USER}
      NEO4J_PASSWORD: ${NEO4J_READONLY_PASSWORD}
      EMBED_URL: ${EMBED_URL}
      GATEWAY_WRITE_ENABLED: ${GATEWAY_WRITE_ENABLED:-false}
    ports:
      - "127.0.0.1:${MEMORY_API_HOST_PORT:-8000}:8000"
    networks: [ai-memory-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    restart: unless-stopped
    depends_on:
      memory-api:
        condition: service_healthy
    environment:
      <<: *common-env
      MEMORY_API_URL: ${MEMORY_API_URL:-http://memory-api:8000}
      MCP_WRITE_ENABLED: ${MCP_WRITE_ENABLED:-false}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8020}:8020"
    networks: [ai-memory-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8020/health').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  neodash:
    image: neo4jlabs/neodash:${NEODASH_IMAGE_TAG:-2.4.11}
    restart: unless-stopped
    profiles: ["viz"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      ssoEnabled: "false"
      standalone: "true"
      standaloneProtocol: bolt
      standaloneHost: localhost
      standalonePort: "7687"
      standaloneDatabase: neo4j
      standaloneDashboardName: "AI Memory"
      standaloneDashboardDatabase: neo4j
    ports:
      - "127.0.0.1:${NEODASH_HOST_PORT:-5005}:5005"
    networks: [ai-memory-net]
    logging: *default-logging
